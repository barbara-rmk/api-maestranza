spring.application.name=Maestranza

# MySQL CONFIG REMOTE - AIVEN
spring.datasource.url=${MYSQL_PUBLIC_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# Configuracion de JPA
# Evitar validaciones/ajustes en la BD al arrancar en producción para
# que el despliegue no realice consultas ni modificaciones de esquema.
# Cambiado de 'validate' a 'none' para NO ejecutar validaciones/DDL al inicio.
spring.jpa.hibernate.ddl-auto=none
# No ejecutar inicializadores SQL automáticos al arrancar (Spring 2.5+)
spring.sql.init.mode=never
# Modo legacy para asegurar compatibilidad con algunas versiones
spring.datasource.initialization-mode=never
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Habilitar lazy init del contexto para evitar crear beans (incluyendo el DataSource)
# hasta que realmente sean necesarios. Esto retrasa la creación del DataSource hasta la
# primera petición que lo necesite.
spring.main.lazy-initialization=true

# Retrasar inicialización de los repositorios JPA para que no se intenten crear
# antes de que el DataSource/EntityManagerFactory esté disponible.
# Opciones: 'deferred' (preferido) o 'default'.
spring.data.jpa.repositories.bootstrap-mode=deferred

#PARA MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=Bw9UeLdf5AjKmPtX7SvRzY3qH6gN8cF2kE5xZ1Tn4yG0sV7pM3hJ6fL9dW2xQ8bC4kR5vT7mY9nG3jD1aS6zP0qX4vB
app.jwt.expiration=86400000

# Configuracion de TimeZone
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.jackson.time-zone=America/Santiago
server.timezone=America/Santiago

# Configuracion de Logging
logging.level.org.springframework=INFO
logging.level.org.apache.tomcat=INFO
logging.level.org.apache.catalina=INFO
logging.level.cl.duoc.maestranza.Maestranza.security=INFO

# Configuracion de Scheduling
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=maestranza-scheduler-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# Configuración del pool de conexiones Hikari (CORREGIDA)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
# Evitar crear conexiones en el arranque: fijamos minimum-idle a 0 para que Hikari
# no trate de mantener conexiones ociosas iniciales.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1800000
## Se omite la query de testeo de conexión para evitar ejecutar consultas al arrancar.
## Si se deja activa, Hikari puede ejecutar una "SELECT 1" al inicializar el pool.
## Se omite la query de testeo de conexión para evitar ejecutar consultas al arrancar.
## Si se deja activa, Hikari puede ejecutar una "SELECT 1" al inicializar el pool.
# spring.datasource.hikari.connection-test-query=SELECT 1

# Evitar que la inicialización del pool falle rápido si la BD no está disponible en
# el arranque (permitir reconexiones posteriores). '-1' desactiva el fail-fast.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000